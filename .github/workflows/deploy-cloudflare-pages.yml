name: Deploy Maensat to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare-pages.yml
      - public/**
      - functions/**
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: maensat-pages-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check site and Pages Functions
        run: |
          npm run check
          node scripts/search-smoke-tests.mjs
          test -s public/index.html
      - name: Deploy site and Pages Functions
        env:
          CLOUDFLARE_ACCOUNT_ID: '218002bc26df57e7e750a6cf8107ef4a'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          PAGES_BRANCH: ${{ inputs.target == 'preview' && 'github-migration-preview' || 'main' }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_PAGES_DEPLOY_TOKEN GitHub Actions secret.'
            exit 1
          fi
          npx --yes wrangler@4.165.0 pages deploy public --project-name maensat --branch "$PAGES_BRANCH"
      - name: Disable automatic deployments from the old GitHub connection
        if: github.event_name == 'push' || inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          project_api=https://api.cloudflare.com/client/v4/accounts/218002bc26df57e7e750a6cf8107ef4a/pages/projects/maensat
          config=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_api" |
            jq -ce '.result.source.config | select(.owner == "maen1977" and .repo_name == "maen_site_analytics")')
          if ! jq -e '.production_deployments_enabled == false and .preview_deployment_setting == "none"' <<< "$config" > /dev/null; then
            curl --fail-with-body --silent --show-error --request PATCH \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"source":{"type":"github","config":{"production_deployments_enabled":false,"preview_deployment_setting":"none"}}}' \
              "$project_api" |
              jq -e '.success and (.result.source.config | .production_deployments_enabled == false and .preview_deployment_setting == "none")' > /dev/null
          fi
