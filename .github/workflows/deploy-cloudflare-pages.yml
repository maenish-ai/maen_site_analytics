name: Deploy Maensat to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: maensat-pages-${{ inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check site and Pages Functions
        run: |
          npm run check
          node scripts/search-smoke-tests.mjs
          test -s public/index.html
      - name: Deploy site and Pages Functions
        env:
          CLOUDFLARE_ACCOUNT_ID: '218002bc26df57e7e750a6cf8107ef4a'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          PAGES_BRANCH: ${{ inputs.target == 'production' && 'main' || 'github-migration-preview' }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_PAGES_DEPLOY_TOKEN GitHub Actions secret.'
            exit 1
          fi
          npx --yes wrangler@4.165.0 pages deploy public --project-name maensat --branch "$PAGES_BRANCH"
