name: Daily frequency and analytics reports
run-name: >-
  ${{
    github.event_name == 'schedule' && 'تحديث الترددات والتقارير اليومي'
    || github.event_name == 'push' && 'فحص تجريبي للترددات'
    || format('تشغيل يدوي للترددات والتقارير ({0})', inputs.run_mode)
  }}

on:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths:
      - scripts/github-daily-frequency-update.mjs
      - scripts/generate-frequency-assets.mjs
      - scripts/search-smoke-tests.mjs
      - scripts/frequency-publisher-votes-test.mjs
      - public/frequencies/frequency-sources.json
      - functions/_lib/frequency-utils.js
  workflow_dispatch:
    inputs:
      run_mode:
        description: What should run?
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - all
          - frequency_only
          - frequency_email_only
          - reports_only
          - analytics_only
      report_date:
        description: Optional analytics report date in Jordan (YYYY-MM-DD). Defaults to yesterday.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'push' && 'maensat-frequency-validation' || 'maensat-pages-production' }}
  cancel-in-progress: false

jobs:
  daily-reports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ github.event_name == 'push' && 'dry_run' || inputs.run_mode || 'all' }}
      ANALYTICS_TIMEZONE: ${{ secrets.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://maensat.pages.dev' }}
      FREQUENCY_SOURCE_CONCURRENCY: ${{ secrets.FREQUENCY_SOURCE_CONCURRENCY || '12' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check report configuration
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_EMAIL_EXTRA: ${{ secrets.REPORT_EMAIL_EXTRA }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '218002bc26df57e7e750a6cf8107ef4a' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/verify-daily-report-env.mjs || {
            for name in RESEND_API_KEY REPORT_EMAIL CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_API_TOKEN; do
              if [[ -z "${!name}" ]]; then
                echo "::warning::Missing GitHub Actions secret: $name"
              fi
            done
          }

      - name: Check publisher voting
        run: node scripts/frequency-publisher-votes-test.mjs

      - name: Check proposed frequency changes
        if: env.MODE == 'dry_run'
        run: |
          candidate_dir=$(mktemp -d)
          trap 'rm -rf "$candidate_dir"' EXIT
          git archive HEAD | tar -x -C "$candidate_dir"
          cd "$candidate_dir"
          npm run github:update-frequencies -- --skip-email
          node scripts/search-smoke-tests.mjs

      - name: Update frequencies
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        run: |
          npm run github:update-frequencies -- --skip-email
          node scripts/search-smoke-tests.mjs

      - name: Save validated frequency data
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frequencies netlify/frequency-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily frequency data"
            git push origin HEAD:main
          fi

      - name: Publish frequency update to Cloudflare
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        env:
          CLOUDFLARE_ACCOUNT_ID: '218002bc26df57e7e750a6cf8107ef4a'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          npx --yes wrangler@4.165.0 pages deploy public --project-name maensat --branch main

      - name: Verify the catalog is live
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const expected = JSON.parse(await readFile('public/frequencies/frequency-manifest.json', 'utf8'));
          const base = 'https://maensat.pages.dev';
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              const manifest = await fetch(`${base}/frequencies/frequency-manifest.json?catalog=${expected.generatedAt}`, {
                signal: AbortSignal.timeout(6000)
              }).then(response => response.ok ? response.json() : null);
              if (manifest?.generatedAt === expected.generatedAt && manifest.count === expected.count) {
                const data = await fetch(`${base}${expected.dataFile}?catalog=${expected.generatedAt}`, {
                  signal: AbortSignal.timeout(10000)
                }).then(response => response.ok ? response.json() : null);
                if (data?.updatedAt === expected.updatedAt && data.items?.length === expected.count) {
                  console.log(`::notice::Published catalog confirmed: ${expected.count} frequencies, ${expected.updatedAt}.`);
                  process.exit(0);
                }
              }
            } catch (error) {
              console.log(`Catalog verification retry: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('The deployed catalog did not become visible on the public site.');
          NODE

      - name: Validate report email addresses
        if: env.MODE == 'reports_only'
        env:
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_EMAIL_EXTRA: ${{ secrets.REPORT_EMAIL_EXTRA }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: |
          node --input-type=module <<'NODE'
          const email = /^[^\s@<>,]+@(?:[a-z0-9-]+\.)+[a-z0-9-]+$/i;
          for (const name of ['REPORT_EMAIL', 'REPORT_EMAIL_EXTRA', 'REPORT_FROM']) {
            const value = (process.env[name] || '').trim();
            const address = name === 'REPORT_FROM' ? value.match(/^[^<>]+<([^<>]+)>$/)?.[1] || value : value;
            if (!email.test(address)) {
              console.error(`::error::${name} is missing or is not a valid email address.`);
              process.exitCode = 1;
            }
          }
          NODE

      - name: Email the frequency report
        if: env.MODE == 'all' || env.MODE == 'frequency_only' || env.MODE == 'frequency_email_only' || env.MODE == 'reports_only'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_EMAIL_EXTRA: ${{ secrets.REPORT_EMAIL_EXTRA }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { sendFrequencyUpdateEmail, setRuntimeContext } from './functions/_lib/frequency-utils.js';

          setRuntimeContext({ env: process.env });
          const report = JSON.parse(await readFile('public/frequencies/latest-frequency-update-report.json', 'utf8'));
          const result = await sendFrequencyUpdateEmail(report);
          if (!result.sent) {
            let error = {};
            try { error = JSON.parse(result.body || '{}'); } catch {}
            const message = String(error.message || '').toLowerCase();
            const field = /\bfrom\b|sender|domain/.test(message) ? 'sender'
              : /\bbcc\b|recipient|\bto field\b/.test(message) ? 'recipient' : '';
            const detail = result.reason || [result.status, error.name, field].filter(Boolean).join(' ');
            console.error(`::error::Frequency email failed: ${detail}`);
            process.exitCode = 1;
          } else {
            console.log(`::notice::Resend accepted the frequency report for ${result.recipientCount} recipient(s) (HTTP ${result.status}).`);
          }
          NODE

      - name: Email the Cloudflare D1 analytics report
        if: ${{ !cancelled() && (env.MODE == 'all' || env.MODE == 'analytics_only' || (env.MODE == 'reports_only' && success())) }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_EMAIL_EXTRA: ${{ secrets.REPORT_EMAIL_EXTRA }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_DATE: ${{ inputs.report_date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '218002bc26df57e7e750a6cf8107ef4a' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run github:analytics-report
