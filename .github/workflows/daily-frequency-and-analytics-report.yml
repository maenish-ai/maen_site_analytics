name: Daily frequency and analytics reports

on:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-frequency-and-analytics-report.yml
      - scripts/github-daily-frequency-update.mjs
  workflow_dispatch:
    inputs:
      run_mode:
        description: What should run?
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - all
          - frequency_only
          - analytics_only
      report_date:
        description: Optional analytics report date in Jordan (YYYY-MM-DD). Defaults to yesterday.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: maensat-pages-production
  cancel-in-progress: false

jobs:
  daily-reports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ github.event_name == 'push' && 'dry_run' || inputs.run_mode || 'all' }}
      ANALYTICS_TIMEZONE: ${{ secrets.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://maensat.pages.dev' }}
      FREQUENCY_SOURCE_CONCURRENCY: ${{ secrets.FREQUENCY_SOURCE_CONCURRENCY || '12' }}
      # An absent listing alone does not establish a closure.
      FREQUENCY_REMOVE_MISSING: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check report configuration
        id: config
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '218002bc26df57e7e750a6cf8107ef4a' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/verify-daily-report-env.mjs || {
            echo '::warning::One or more daily report settings are missing.'
          }

      - name: Check proposed frequency changes
        if: env.MODE == 'dry_run'
        run: npm run github:update-frequencies -- --dry-run

      - name: Update frequencies
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        run: |
          npm run github:update-frequencies -- --skip-email
          node scripts/search-smoke-tests.mjs

      - name: Save validated frequency data
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frequencies netlify/frequency-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily frequency data"
            git push origin HEAD:main
          fi

      - name: Publish frequency update to Cloudflare
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        env:
          CLOUDFLARE_ACCOUNT_ID: '218002bc26df57e7e750a6cf8107ef4a'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          npx --yes wrangler@4.165.0 pages deploy public --project-name maensat --branch main

      - name: Email the frequency report
        if: env.MODE == 'all' || env.MODE == 'frequency_only'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { sendFrequencyUpdateEmail, setRuntimeContext } from './functions/_lib/frequency-utils.js';

          setRuntimeContext({ env: process.env });
          const report = JSON.parse(await readFile('public/frequencies/latest-frequency-update-report.json', 'utf8'));
          const result = await sendFrequencyUpdateEmail(report);
          if (!result.sent) {
            throw new Error(`Frequency email failed: ${result.reason || result.status}`);
          }
          console.log(`Resend accepted the frequency report (HTTP ${result.status}).`);
          NODE

      - name: Email the Cloudflare D1 analytics report
        if: ${{ !cancelled() && (env.MODE == 'all' || env.MODE == 'analytics_only') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_DATE: ${{ inputs.report_date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '218002bc26df57e7e750a6cf8107ef4a' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run github:analytics-report
