name: One-time Actions history cleanup
run-name: تنظيف سجل التشغيلات القديمة
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-approved-actions-runs.yml
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only the approved completed runs
        run: |
          set -euo pipefail
          repo=maenish-ai/maen_site_analytics
          [[ "$GITHUB_REPOSITORY" == "$repo" ]]
          protected=(44708427925 44707140051 44704579875)
          approved=(
            44602154532
            44602818855
            44603833585
            44603929492
            44604040374
            44604189774
            44604356286
            44604356583
            44604461432
            44604748122
            44607223416
            44607292994
            44611715461
            44611775542
            44613168390
            44613168656
            44613262150
            44613398814
            44695157351
            44695157427
            44695255369
            44695255418
            44695446111
            44696482272
            44696644440
            44700616093
            44700616097
            44702323322
            44702323348
            44703390769
            44704464252
            44704464304
            44704892055
            44704892113
            44706038082
            44706211603
            44706392940
            44706594768
            44706595050
            44706655558
            44706780956
            44706780969
            44706969992
            44706970047
          )
          [[ "${#approved[@]}" == 44 ]]
          snapshot=$(mktemp)
          gh api "repos/$repo/actions/runs?per_page=100" > "$snapshot"
          for id in "${protected[@]}" "${approved[@]}"; do
            jq -e --argjson id "$id" '.workflow_runs | any(.id == $id and .status == "completed")' "$snapshot" > /dev/null
          done
          for id in "${approved[@]}"; do
            [[ "$id" != "$GITHUB_RUN_ID" ]]
            for keep in "${protected[@]}"; do [[ "$id" != "$keep" ]]; done
            gh api --method DELETE "repos/$repo/actions/runs/$id"
          done
          echo '::notice::Deleted all 44 approved runs.'
      - name: Remove the cleanup run if GitHub allows it
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ||
            echo '::notice::GitHub will retain this maintenance run until it is deleted after completion.'
